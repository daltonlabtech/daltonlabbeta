<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dalton Lab · Casos (mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400&family=Playfair+Display:ital,wght@1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --void:#050608;
  --ink:#e6edf4; --ink2:#aab8c8; --ink3:#7d8898;
  --accent:#8fe6ff;
  --line:rgba(162,182,206,.26);
  --line-soft:rgba(162,182,206,.12);
  --sans:"Manrope","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --serif:"Playfair Display","Baskerville","Bodoni MT","Didot",Georgia,serif;
  --mono:"JetBrains Mono","Cascadia Code","SF Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--void);color:var(--ink2);font:400 15px/1.55 var(--sans);overflow-x:hidden}
a{color:var(--ink2);text-decoration:none}
a:hover{color:var(--ink)}
button{font:inherit;background:none;border:none;color:inherit}
.bg-grad,.bg-grain,.bg-vig{position:fixed;inset:0;pointer-events:none}
.bg-grad{background:radial-gradient(120% 100% at 50% 30%,#12131a 0%,#0a0b11 42%,#050608 78%,#030304 100%);z-index:0}
.bg-grain{background-image:radial-gradient(rgba(200,220,255,.6) .5px,transparent .5px);background-size:3px 3px;opacity:.045;mix-blend-mode:screen;z-index:1}
.bg-vig{box-shadow:inset 0 0 260px 70px rgba(0,0,0,.82);z-index:2}
main,footer{position:relative;z-index:3}
.em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--accent);text-shadow:0 0 28px rgba(143,230,255,.35),0 0 60px rgba(143,230,255,.14)}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:14px 24px;border-radius:999px;border:0;font:400 15px var(--sans);white-space:nowrap;cursor:pointer}
.btn-p{background:var(--accent);color:#04121a;box-shadow:0 0 26px rgba(143,230,255,.28)}
.btn-s{background:rgba(16,20,27,.7);border:1px solid var(--line);backdrop-filter:blur(8px);color:var(--ink2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:999px}
.btn-col{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.btn-col .btn{width:100%;max-width:320px}
/* header (igual à home mobile) */
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:72px;padding:0 22px;background:transparent;border-bottom:1px solid transparent;transition:background .3s,border-color .3s}
header.scrolled{background:rgba(8,10,15,.72);backdrop-filter:blur(12px);border-bottom-color:var(--line-soft)}
.brand{display:inline-flex;align-items:center}
.brand img{height:16px;display:block}
.burger{width:44px;height:44px;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.burger span{display:block;width:20px;height:1.4px;background:var(--ink)}
/* menu overlay */
.menu{position:fixed;inset:0;z-index:30;background:rgba(5,6,8,.94);backdrop-filter:blur(14px);display:none;flex-direction:column;padding:10px 22px 44px}
.menu.open{display:flex}
.menu-top{display:flex;align-items:center;justify-content:space-between;height:54px}
.menu-x{width:44px;height:44px;background:none;border:0;color:var(--ink);font:200 30px/1 var(--sans);cursor:pointer}
.menu nav{display:flex;flex-direction:column;gap:26px;margin:auto 0;padding-top:40px}
.menu nav a{font:200 30px var(--sans);color:var(--ink2)}
.menu nav .atual{font:200 30px var(--sans);color:var(--ink);padding-bottom:6px;border-bottom:1px solid var(--accent);align-self:flex-start}
.menu-foot{display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(16,20,27,.55)}
.lang span{font:400 12px var(--sans);padding:8px 14px;color:var(--ink3)}
.lang .on{background:rgba(162,182,206,.14);color:var(--ink)}
.dead{cursor:default}
/* índice */
.hero{padding:110px 22px 28px;display:flex;flex-direction:column;align-items:center;text-align:center}
.mono-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink3)}
.hero h1{margin-top:14px;font-weight:200;font-size:28px;line-height:1.12;letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 22px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.pills::-webkit-scrollbar{display:none}
.pill{padding:10px 16px;min-height:40px;border-radius:999px;font-size:13.5px;cursor:pointer;white-space:nowrap;flex:none;border:1px solid var(--line);background:rgba(16,20,27,.7);color:var(--ink2);transition:background .2s,color .2s,border-color .2s}
.pill.on{background:var(--accent);border-color:var(--accent);color:#04121a;box-shadow:0 0 26px rgba(143,230,255,.28)}
.grid{margin-top:24px;padding:0 22px 56px;display:grid;grid-template-columns:1fr;gap:14px}
.caso{position:relative;display:flex;flex-direction:column;gap:11px;padding:20px 18px 16px;border-radius:12px;background:rgba(14,18,24,.72);border:1px solid var(--line-soft);cursor:pointer;transition:opacity .25s ease;text-align:left}
.caso .topbar{position:absolute;top:-1px;left:-1px;right:-1px;height:2px;border-radius:12px 12px 0 0}
.caso .idrow{display:flex;align-items:flex-start;gap:8px}
.caso .idrow svg{flex:none;margin-top:1px}
.caso .id{font-family:var(--mono);font-size:9px;letter-spacing:.2em;line-height:1.7;color:var(--ink3)}
.chip-op{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(16,20,27,.7);font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:var(--ink2);white-space:nowrap;flex:none}
.chip-op i{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px 1px rgba(143,230,255,.7);flex:none}
.caso .num{font-size:30px;font-weight:200;line-height:1.05;color:var(--ink)}
.caso .frase{font-size:13.5px;line-height:1.45;color:var(--ink2)}
.caso .cli{font-family:var(--mono);font-size:9px;letter-spacing:.05em;line-height:1.6;color:var(--ink3)}
.caso .miolo{display:flex;flex-direction:column;gap:6px;padding:7px 0}
.grid.fading .caso{opacity:0}
/* fecho */
.fecho{padding:20px 22px 36px;display:flex;flex-direction:column;align-items:center;text-align:center}
.fecho p{font-weight:200;font-size:23px;line-height:1.3}
.fecho .r1{color:var(--ink3)}
.fecho .r1 s{text-decoration:line-through;text-decoration-thickness:1px}
.fecho .r2{margin-top:6px;color:var(--ink)}
.fecho .btn-col{margin-top:18px}
/* leitor */
.reader{padding:96px 22px 56px}
.volta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn-volta{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(16,20,27,.7);color:var(--ink2);font:400 13.5px var(--sans);white-space:nowrap;cursor:pointer}
.volta-row .setor{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;color:var(--ink3)}
.reader h1{margin-top:18px;font-weight:200;font-size:24px;line-height:1.2;color:var(--ink);text-wrap:balance}
.papel-cli{margin-top:12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;line-height:1.8;color:var(--ink3);text-transform:uppercase}
.kpis{margin-top:28px}
.kpi{padding:14px 0}
.kpi+.kpi{border-top:1px solid var(--line-soft)}
.kpi .rot{font-size:13.5px;line-height:1.5;color:var(--ink2)}
.kpi .num{margin-top:7px;font-size:30px;font-weight:200;line-height:1.05;color:var(--ink)}
.meta{margin-top:34px;border-top:1px solid var(--line-soft)}
.meta>div{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
.meta .k{color:var(--ink3);flex:none}
.meta .v{color:var(--ink2);text-align:right}
.sec{margin-top:48px}
.sec-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;color:var(--ink3)}
.sec .p1{margin-top:13px;font-size:14.5px;line-height:1.6;color:var(--ink2)}
.sec .p2{margin-top:11px;font-size:13.5px;line-height:1.6;color:var(--ink3)}
.pergunta{margin-top:36px;font-weight:200;font-size:20px;line-height:1.4;color:var(--ink);text-align:center;text-wrap:balance}
.op-head{margin-top:32px;display:flex;flex-direction:column;align-items:flex-start;gap:11px}
.op-head h2{font-size:20px;font-weight:200;line-height:1.3;color:var(--ink)}
.fluxo{position:relative;margin-top:24px}
.fluxo .linha{position:absolute;left:3.5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.fluxo .passos{position:relative;display:flex;flex-direction:column;gap:22px}
.fluxo .passo{display:flex;align-items:flex-start;gap:15px}
.fluxo .dot{margin-top:5px;width:8px;height:8px;border-radius:50%;background:var(--ink2);box-shadow:0 0 0 4px #0a0c12;flex:none}
.fluxo .passo.humano .dot{background:var(--accent);box-shadow:0 0 0 4px #0a0c12,0 0 14px 2px rgba(143,230,255,.65),0 0 34px 6px rgba(143,230,255,.25)}
.fluxo .txt{font-size:13.5px;line-height:1.5;color:var(--ink2)}
.fluxo .passo.humano .txt{color:var(--ink)}
.comp{margin-top:18px;border:1px solid var(--line-soft);border-radius:12px;background:rgba(14,18,24,.72);padding:22px 20px}
.comp .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;color:var(--ink3);text-transform:uppercase}
.comp .col{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.comp .cel .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase}
.comp .cel .v{margin-top:7px;font-size:23px;font-weight:200;color:var(--ink)}
.comp .arrow{font-size:18px;color:var(--accent);text-shadow:0 0 18px rgba(143,230,255,.5)}
.comp .nota{margin-top:16px;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;line-height:1.7;color:var(--ink3)}
.fluxo-vivo{margin-top:18px}
.fluxo-vivo a{font-size:14px;color:var(--accent);display:inline-flex;align-items:center;min-height:44px}
.pager{margin-top:48px;border-top:1px solid var(--line-soft);padding-top:18px;display:flex;flex-direction:column;gap:10px}
.pager button{font-size:14.5px;color:var(--ink2);cursor:pointer;text-align:left;line-height:1.4;min-height:44px}
.center{display:flex;justify-content:center}
/* footer (igual à home mobile) */
footer{border-top:1px solid var(--line-soft);padding:40px 22px 32px}
.foot-logo{height:14px;display:block}
.foot-copy{margin-top:24px;font-size:14px;color:var(--ink2)}
.foot-social{display:flex;gap:26px;margin-top:28px}
.foot-social a{color:var(--ink2);display:inline-flex}
.foot-div{height:1px;background:var(--line-soft);margin:32px 0 22px}
.foot-links{display:flex;justify-content:center;gap:32px}
.foot-links a{font-size:14px;color:var(--ink2)}
</style>
</head>
<body>
<div class="bg-grad"></div><div class="bg-grain"></div><div class="bg-vig"></div>

<header id="hdr">
  <a class="brand" href="mobile.html" aria-label="Dalton Lab — voltar à home"><img src="daltonlab-logo.png" alt="Dalton Lab"></a>

</div>

<footer>
  <a href="mobile.html"><img class="foot-logo" src="daltonlab-logo.png" alt="Dalton Lab"></a>
  <p class="foot-copy">© 2026 Dalton Lab. Todos os direitos reservados.</p>
  <div class="foot-social">
    <a href="#" class="dead" aria-label="LinkedIn"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="2" y="2" width="20" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"></rect><circle cx="8" cy="8.6" r="1.4"></circle><rect x="6.9" y="11" width="2.2" height="6.5" rx="1"></rect><path d="M12 11h2.1v1c.5-.7 1.3-1.2 2.4-1.2 1.8 0 2.7 1.1 2.7 3.2v3.5h-2.2v-3.2c0-1-.4-1.6-1.3-1.6-.9 0-1.5.6-1.5 1.7v3.1H12z"></path></svg></a>
    <a href="#" class="dead" aria-label="YouTube"><svg viewBox="0 0 24 24" width="22" height="22"><rect x="2" y="5" width="20" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"></rect><path d="M10 9.2l5 2.8-5 2.8z" fill="currentColor"></path></svg></a>

<script src="casos-data.js"></script>
<script>
(function(){
'use strict';
var C=window.CASOS, N=C.dados.length;
var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var view=document.getElementById('view');
var filtro='Todos';

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function casoAtual(){var m=location.hash.match(/^#caso-(\d+)$/);if(!m)return null;var i=+m[1];return(i>=0&&i<N)?i:null;}

/* ---------- índice ---------- */
function htmlCard(c,i){
  var cor=C.cores[c.setor], vit=C.vitrines[i];
  var oculto=(filtro!=='Todos'&&c.setor!==filtro);
  return '<button class="caso" data-i="'+i+'" aria-label="'+esc(c.papel)+'"'+(oculto?' style="display:none"':'')+'>'
    +'<span class="topbar" style="background:'+cor+'"></span>'
    +'<span class="idrow">'
    +'<span class="id">'+esc((c.setor+' · '+c.papel).toUpperCase())+'</span>'
    +'</span>'
    +'<span class="miolo"><span class="num">'+esc(vit[0])+'</span><span class="frase">'+esc(vit[1])+'</span></span>'
    +'<span class="cli">'+esc(c.cliente)+'</span>'
    +'</button>';
}
function renderIndex(){
  var pills=C.setores.map(function(n){return '<button class="pill'+(n===filtro?' on':'')+'" data-f="'+esc(n)+'">'+esc(n)+'</button>';}).join('');
  var cards=C.dados.map(htmlCard).join('');
  view.innerHTML=
    '<section class="hero"><div class="mono-label">Casos</div><h1>Organizações que já operam com <em class="em">agentes de IA</em>.</h1></section>'
    +'<section><div class="pills" role="group" aria-label="Filtrar por setor">'+pills+'</div>'
    +'<div class="grid" id="grid">'+cards+'</div></section>'
    +'<section class="fecho">'
    +'<p class="r2">Seja uma organização <em class="em">agêntica</em>.</p>'
    +'<div class="btn-col"><a class="btn btn-p" href="https://formulario.daltonlab.ai/" target="_blank" rel="noopener">Fale com um especialista</a></div>'
    +'</section>';
  view.querySelectorAll('.pill').forEach(function(b){b.addEventListener('click',function(){setFiltro(b.dataset.f);});});
  view.querySelectorAll('.caso').forEach(function(b){b.addEventListener('click',function(){location.hash='caso-'+b.dataset.i;});});
  pintarPills();
}
/* pill ativa ganha a cor do setor (Todos fica no ciano padrão) */
function pintarPills(){
  view.querySelectorAll('.pill').forEach(function(b){
    var on=b.dataset.f===filtro, cor=C.cores[b.dataset.f];
    b.classList.toggle('on',on);
    if(on&&cor){b.style.background=cor;b.style.borderColor=cor;b.style.color='#04121a';b.style.boxShadow='0 0 26px '+cor+'55';}
    else{b.style.background='';b.style.borderColor='';b.style.color='';b.style.boxShadow='';}
  });
}
function setFiltro(f){
  if(f===filtro)return;
  var grid=document.getElementById('grid');
  var aplicar=function(){
    filtro=f;
    pintarPills();
    view.querySelectorAll('.caso').forEach(function(b){
      var c=C.dados[+b.dataset.i];
      b.style.display=(f==='Todos'||c.setor===f)?'':'none';
    });
    grid.classList.remove('fading');
  };
  if(reduced){aplicar();return;}
  grid.classList.add('fading');
  setTimeout(aplicar,240);
}

/* ---------- leitor ---------- */
function renderReader(i){
  var c=C.dados[i], p=C.perguntas[i];
  var kpis=c.kpis.map(function(k){return '<div class="kpi"><div class="rot">'+esc(k.rotulo)+'</div><div class="num">'+esc(k.numero)+'</div></div>';}).join('');
  var passos=c.fluxo.slice(0,4).map(function(t){return '<div class="passo"><div class="dot"></div><div class="txt">'+esc(t)+'</div></div>';}).join('')
    +'<div class="passo humano"><div class="dot"></div><div class="txt">'+esc(c.fluxo[4])+'</div></div>';
  var impacto='';
  if(c.comparativo){
    impacto='<div class="sec"><div class="sec-label">IMPACTO</div>'
      +'<div class="comp"><div class="lbl">'+esc(c.comparativo.label)+'</div>'
      +'<div class="col"><div class="cel"><div class="k">'+esc(c.comparativo.pares[0].rotulo)+'</div><div class="v">'+esc(c.comparativo.pares[0].valor)+'</div></div>'
      +'<div class="arrow" aria-hidden="true">↓</div>'
      +'<div class="cel"><div class="k">'+esc(c.comparativo.pares[1].rotulo)+'</div><div class="v">'+esc(c.comparativo.pares[1].valor)+'</div></div></div>'
      +'<div class="nota">'+esc(c.comparativo.nota)+'</div></div>'
      +'</div>';
  }
  view.innerHTML=
    '<section class="reader">'
    +'<div class="volta-row"><button class="btn-volta" id="voltar1" type="button">← Voltar para os casos</button><span class="setor">'+esc(c.setor.toUpperCase())+'</span></div>'
    +'<h1>'+esc(c.headline)+'</h1>'
    +'<div class="papel-cli">'+esc(c.papel+' · '+c.cliente)+'</div>'
    +'<div class="kpis">'+kpis+'</div>'
    +'<div class="meta">'
    +'<div><span class="k">SETOR</span><span class="v">'+esc(c.setor.toUpperCase())+'</span></div>'
    +'<div><span class="k">ESTÁGIO</span><span class="v">'+esc(C.publico(c.estagio).toUpperCase())+'</span></div>'
    +'<div><span class="k">PAPEL DO AGENTE</span><span class="v">'+esc(c.papel.toUpperCase())+'</span></div>'
    +'</div>'
    +'<div class="sec"><div class="sec-label">DESAFIO</div>'
    +'<p class="p1">'+esc(c.problema)+'</p><p class="p2">'+esc(c.comoTrabalhava)+'</p>'
    +'<p class="pergunta">'+esc(p[0])+'<em class="em">'+esc(p[1])+'</em>'+esc(p[2])+'</p></div>'
    +'<div class="sec"><div class="sec-label">SOLUÇÃO</div>'
    +'<p class="p1">'+esc(c.oQueMudou)+'</p>'
    +'<div class="op-head"><h2>O agente na operação</h2><span class="chip-op" style="margin-left:0"><i></i>HUMANO ACIMA DO LOOP</span></div>'
    +'<div class="fluxo"><div class="linha"></div><div class="passos">'+passos+'</div></div></div>'
    +impacto
    +'<div class="center" style="margin-top:48px;border-top:1px solid var(--line-soft);padding-top:28px"><button class="btn btn-s" id="voltar2" type="button">← Voltar para os casos</button></div>'
    +'</section>';
  document.getElementById('voltar1').addEventListener('click',voltar);
  document.getElementById('voltar2').addEventListener('click',voltar);
}
function voltar(){
  if(location.hash){history.pushState('', document.title, location.pathname+location.search);}
  render();window.scrollTo(0,0);
}
function render(){
  var i=casoAtual();
  if(i===null)renderIndex();else renderReader(i);
}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});

/* header vidro */
var hdr=document.getElementById('hdr');
window.addEventListener('scroll',function(){hdr.classList.toggle('scrolled',window.scrollY>80);},{passive:true});

/* menu overlay */
var menu=document.getElementById('menu'),burger=document.getElementById('burger');
function openMenu(){menu.classList.add('open');burger.setAttribute('aria-expanded','true');}
function closeMenu(){menu.classList.remove('open');burger.setAttribute('aria-expanded','false');}
burger.addEventListener('click',openMenu);
document.getElementById('menuX').addEventListener('click',closeMenu);
menu.addEventListener('click',function(e){if(e.target===menu)closeMenu();});
menu.querySelectorAll('[data-close]').forEach(function(a){a.addEventListener('click',closeMenu);});
addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu();});

/* links mortos do chrome */
document.querySelectorAll('.menu a.dead,footer a.dead').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();});});

render();
})();
</script>
</body>
</html>
