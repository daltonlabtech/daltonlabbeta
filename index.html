<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- GTM loaded with delay for performance -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <!--
      title, description, canonical e as tags Open Graph / Twitter são gerenciadas
      por rota via react-helmet-async (<Seo>). NÃO adicionar versões estáticas aqui
      para evitar tags duplicadas no <head> renderizado.
    -->
    <meta name="keywords" content="organização agêntica, agentes de IA, IA agêntica, transformação digital, automação com IA, agentes inteligentes, AI-first, Dalton Lab, inteligência artificial para empresas" />
    <meta name="author" content="Dalton Lab" />
    <meta name="theme-color" content="#050608" />

    <!-- Critical CSS Inline - Above the fold rendering -->
    <style>
      /* Critical CSS for immediate first paint — espelha o 1º frame da coreografia (tema void) */
      *,*::before,*::after{box-sizing:border-box}
      body{margin:0;font-family:Manrope,"Segoe UI",system-ui,-apple-system,sans-serif;background:#050608;color:#aab8c8;-webkit-font-smoothing:antialiased}
      #root{min-height:100vh}
      .hero-critical{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(120% 100% at 50% 30%,#12131a 0%,#0a0b11 42%,#050608 78%,#030304 100%);padding:92px 24px}
      .hero-content{position:relative;z-index:2;width:100%;max-width:760px;margin:0 auto;text-align:center}
      .hero-h1{font-weight:200;letter-spacing:-0.012em;line-height:1.06;font-size:clamp(30px,3.4vw,46px);color:#e6edf4;margin:0;text-wrap:balance}
      .hero-h1 s{color:#7d8898;text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:#7d8898}
      .hero-serif{font-family:"Playfair Display",Georgia,serif;font-weight:400;font-style:italic;color:#8fe6ff;text-shadow:0 0 28px rgba(143,230,255,.35),0 0 60px rgba(143,230,255,.14)}
      .hero-sub{margin:14px auto 0;font-size:16px;line-height:1.5;color:#aab8c8;max-width:48ch}
      .hero-sub s{color:#7d8898;text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:#7d8898}
      .hero-actions{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:26px}
      .hero-cta,.hero-ghost{display:inline-flex;align-items:center;justify-content:center;padding:15px 30px;border-radius:999px;font-size:15px;font-weight:400;min-height:48px;text-decoration:none;white-space:nowrap}
      .hero-cta{background:#8fe6ff;color:#04121a;box-shadow:0 0 26px rgba(143,230,255,.28)}
      .hero-ghost{background:rgba(16,20,27,.7);color:#aab8c8;border:1px solid rgba(162,182,206,.26)}
      @media(min-width:640px){.hero-actions{flex-direction:row;justify-content:center;align-items:center}}
    </style>

    <!-- DNS Prefetch & Preconnect for Performance -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
    <link rel="dns-prefetch" href="//connect.facebook.net" />
    <link rel="dns-prefetch" href="//www.facebook.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://content.hotjar.io" />

    <!-- Google Fonts with display=swap - loaded async -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet"
    /></noscript>

    <!-- Redesign fonts (tema void: Manrope / Playfair Display / JetBrains Mono) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@1,400;1,500&display=swap"
      rel="stylesheet"
    />

    <!--
      Open Graph / Twitter: gerenciadas por rota via react-helmet-async (<Seo>).
      Removidas daqui para não duplicar no <head> renderizado.
    -->

    <!-- Favicon - Multiple formats for compatibility -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/webp" sizes="32x32" href="/favicon.webp" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- JSON-LD Structured Data -->

    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Dalton Lab",
      "url": "https://www.daltonlab.ai",
      "logo": "https://www.daltonlab.ai/dalton-icon.webp",

      "foundingDate": "2023",
      "sameAs": [
        "https://www.linkedin.com/company/dalton-lab/",

        "https://www.instagram.com/daltonlab.ai",
        "https://open.spotify.com/show/4fnDNmjCB0EQzT7HlmCUr4"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "administrativo@daltonlab.ai",
        "contactType": "customer service",
        "availableLanguage": ["Portuguese", "English", "Spanish"]
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Dalton Lab",
      "url": "https://www.daltonlab.ai",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.daltonlab.ai/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-PPF26W8Q"

        width="0"
        style="display:none;visibility:hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"><section class="hero-critical" aria-label="Hero">
      <div class="hero-content">
        <h1 class="hero-h1"><s>Not bigger.</s> <span class="hero-serif">Agentic.</span></h1>
        <p class="hero-sub">As empresas do futuro não serão maiores. Serão agênticas.</p>
        <div class="hero-actions">
          <a href="https://formulario.daltonlab.ai/" class="hero-cta">Fale com um especialista</a>
          <a href="#solutions" class="hero-ghost">Explore nossa metodologia</a>

    <script type="module" src="/src/main.tsx"></script>
    <!-- GTM: delayed load after 3s or first user interaction -->
    <script>
      (function(){
        var loaded=false;
        function loadGTM(){
          if(loaded)return;loaded=true;
          window.dataLayer=window.dataLayer||[];
          window.dataLayer.push({'gtm.start':new Date().getTime(),event:'gtm.js'});
          var j=document.createElement('script');j.async=true;
          j.src='https://www.googletagmanager.com/gtm.js?id=GTM-PPF26W8Q';
          document.head.appendChild(j);
        }
        setTimeout(loadGTM,3000);
        ['scroll','click','touchstart','keydown'].forEach(function(e){
          document.addEventListener(e,loadGTM,{once:true,passive:true});
        });
      })();
    </script>
    <!-- Hotjar: delayed load after 3s or first user interaction -->

      (function(){
        var loaded=false;

            h._hjSettings={hjid:6541641,hjsv:6};
            a=o.getElementsByTagName('head')[0];
            r=o.createElement('script');r.async=1;
            r.src=t+h._hjSettings.hjid+j+h._hjSettings.hjsv;
            a.appendChild(r);
          })(window,document,'https://static.hotjar.com/c/hotjar-','.js?sv=');

</html>
