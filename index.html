      /* Critical CSS for immediate first paint — espelha o HeroSection do novo design */
      *,*::before,*::after{box-sizing:border-box}
      body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#0A1628;color:#FFFFFF;-webkit-font-smoothing:antialiased}
      #root{min-height:100vh}
      .hero-critical{position:relative;min-height:100svh;display:flex;align-items:center;overflow:hidden;background:#0A1628;padding:80px 24px 170px}
      .hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(100,160,210,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(100,160,210,0.08) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(120% 90% at 70% 0%,#000 0%,transparent 72%);mask-image:radial-gradient(120% 90% at 70% 0%,#000 0%,transparent 72%);opacity:.6}
      .hero-glow{pointer-events:none;position:absolute;top:-18%;right:0;width:70vw;height:70vw;max-width:720px;max-height:720px;background:radial-gradient(circle at 50% 42%,rgba(76,184,232,0.26) 0%,rgba(76,184,232,0.12) 32%,rgba(76,184,232,0.04) 52%,transparent 72%);filter:blur(80px);opacity:.8}

      .hero-serif{font-family:"Playfair Display",Georgia,serif;font-weight:500;font-style:italic;color:#4CB8E8}
      .hero-actions{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin-top:24px}
      .hero-cta,.hero-ghost{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 24px;border-radius:100px;font-size:14px;font-weight:600;letter-spacing:-0.01em;min-height:42px;text-decoration:none;white-space:nowrap}
      .hero-cta{background:#4CB8E8;color:#06121a}
      .hero-ghost{background:transparent;color:#FFFFFF;border:1px solid rgba(100,160,210,0.15)}
      @media(min-width:640px){.hero-actions{flex-direction:row;align-items:center}}
