<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dalton Lab — Preview Desktop</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(120% 90% at 50% -10%, #1a2740 0%, transparent 55%),
      radial-gradient(100% 80% at 50% 120%, #0e1626 0%, transparent 60%),
      linear-gradient(160deg, #14181f, #0a0c10);
    font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: #cdd9e6;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(120,160,210,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(70% 60% at 50% 45%, #000, transparent 80%);
            mask-image: radial-gradient(70% 60% at 50% 45%, #000, transparent 80%);
    pointer-events: none;
  }
  #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .scaler { transform-origin: center center; will-change: transform; }
  .win-frame iframe { display: block; width: 100%; height: 100%; border: 0; background: #060D1A; }

  .hint {
    position: fixed;
    left: 50%; bottom: 20px;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 9px;
    padding: 9px 16px; border-radius: 100px;
    background: rgba(10,16,28,0.7);
    border: 1px solid rgba(120,170,220,0.18);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 12.5px; font-weight: 500; color: #9fb6cd;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transition: opacity .6s ease, transform .6s ease;
    z-index: 100;
  }
  .hint.hide { opacity: 0; transform: translateX(-50%) translateY(8px); pointer-events: none; }
  .hint .dot { width: 7px; height: 7px; border-radius: 50%; background: #4CB8E8; box-shadow: 0 0 10px #4CB8E8; animation: pulse 1.8s cubic-bezier(.16,1,.3,1) infinite; flex: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  @media (prefers-reduced-motion: reduce) { .hint .dot { animation: none; } }
</style>
</head>
<body>
  <div id="root"></div>
  <div class="hint" id="hint">
    <span class="dot"></span>
    <span>Preview desktop (1440px) · role dentro da janela · PT / EN no topo</span>
  </div>

  <script type="text/babel" src="browser-window.jsx"></script>
  <script type="text/babel">
    const WIN_W = 1440;
    const CONTENT_H = 884;          // visible viewport height of the page
    const CHROME_H = 84;            // tab bar (44) + toolbar (40)
    const WIN_H = CONTENT_H + CHROME_H;
    const MARGIN = 40;

    function DesktopPreview() {
      const scalerRef = React.useRef(null);

      React.useEffect(() => {
        const fit = () => {
          const vw = window.innerWidth, vh = window.innerHeight;
          const s = Math.min((vw - MARGIN) / WIN_W, (vh - MARGIN) / WIN_H, 1);
          if (scalerRef.current) scalerRef.current.style.transform = `scale(${s})`;
        };
        fit();
        window.addEventListener('resize', fit);
        const hint = document.getElementById('hint');
        const t = setTimeout(() => hint && hint.classList.add('hide'), 5200);
        return () => { window.removeEventListener('resize', fit); clearTimeout(t); };
      }, []);

      return (
        <div className="scaler" ref={scalerRef}>
          <ChromeWindow
            width={WIN_W}
            height={WIN_H}
            url="daltonlab.ai"
            tabs={[{ title: 'Dalton Lab — Organizações Agênticas' }, { title: 'Nova aba' }]}
            activeIndex={0}
          >
            <div className="win-frame" style={{ width: '100%', height: '100%' }}>
              <iframe
                src="index.html"
                title="Dalton Lab — site desktop"
                scrolling="yes"
                allow="autoplay; encrypted-media; fullscreen"
              />
            </div>
          </ChromeWindow>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DesktopPreview />);
  </script>
</body>
</html>
