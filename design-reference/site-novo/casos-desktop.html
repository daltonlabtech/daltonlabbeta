<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dalton Lab · Casos (desktop)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400&family=Playfair+Display:ital,wght@1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --void:#050608;
  --ink:#e6edf4; --ink2:#aab8c8; --ink3:#7d8898;
  --accent:#8fe6ff;
  --line:rgba(162,182,206,.26);
  --line-soft:rgba(162,182,206,.12);
  --sans:"Manrope","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --serif:"Playfair Display","Baskerville","Bodoni MT","Didot",Georgia,serif;
  --mono:"JetBrains Mono","Cascadia Code","SF Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--void);color:var(--ink2);font:400 15px/1.55 var(--sans);overflow-x:hidden}
a{color:var(--ink2);text-decoration:none}
a:hover{color:var(--ink)}
button{font:inherit;background:none;border:none;color:inherit}
.bg-grad,.bg-grain,.bg-vig{position:fixed;inset:0;pointer-events:none}
.bg-grad{background:radial-gradient(120% 100% at 50% 30%,#12131a 0%,#0a0b11 42%,#050608 78%,#030304 100%);z-index:0}
.bg-grain{background-image:radial-gradient(rgba(200,220,255,.6) .5px,transparent .5px);background-size:3px 3px;opacity:.045;mix-blend-mode:screen;z-index:1}
.bg-vig{box-shadow:inset 0 0 260px 70px rgba(0,0,0,.82);z-index:2}
main,footer{position:relative;z-index:3}
.em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--accent);text-shadow:0 0 28px rgba(143,230,255,.35),0 0 60px rgba(143,230,255,.14)}
.mono{font-family:var(--mono)}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:15px 30px;border-radius:999px;border:0;font:400 15px var(--sans);white-space:nowrap;cursor:pointer}
.btn-p{background:var(--accent);color:#04121a;box-shadow:0 0 26px rgba(143,230,255,.28)}
.btn-p:hover{filter:brightness(1.08);color:#04121a}
.btn-s{background:rgba(16,20,27,.7);border:1px solid var(--line);backdrop-filter:blur(8px);color:var(--ink2)}
.btn-s:hover{color:var(--ink);border-color:rgba(162,182,206,.45)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:999px}
/* header (igual à home) */
header{position:fixed;top:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:92px;padding:0 44px;background:transparent;border-bottom:1px solid transparent;transition:background .3s,border-color .3s,backdrop-filter .3s}
header.scrolled{background:rgba(8,10,15,.72);backdrop-filter:blur(12px);border-bottom-color:var(--line-soft)}
.brand{display:inline-flex;align-items:center;justify-self:start}
.brand img{height:22px;display:block}
nav.main-nav{display:flex;gap:34px}
nav.main-nav a{font:400 15px var(--sans);color:var(--ink2)}
nav.main-nav a:hover{color:var(--ink)}
nav.main-nav .atual{font:400 15px var(--sans);color:var(--ink);padding-bottom:5px;border-bottom:1px solid var(--accent)}
.hdr-right{display:flex;align-items:center;gap:16px;justify-self:end}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(16,20,27,.55);backdrop-filter:blur(8px)}
.lang span{font:400 12px var(--sans);padding:7px 13px;color:var(--ink3)}
.lang .on{background:rgba(162,182,206,.14);color:var(--ink)}
.btn-hdr{min-height:38px;padding:9px 20px;font-size:14px}
.dead{cursor:default}
/* índice */
.hero{padding:150px 40px 36px;display:flex;flex-direction:column;align-items:center;text-align:center}
.mono-label{font-family:var(--mono);font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--ink3)}
.hero h1{margin-top:18px;font-weight:200;font-size:clamp(30px,3.4vw,46px);line-height:1.08;letter-spacing:-.01em;color:var(--ink);max-width:840px;text-wrap:balance}
.wrap{max-width:1120px;margin:0 auto;padding:0 40px 64px}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.pill{padding:10px 20px;min-height:40px;border-radius:999px;font-size:13.5px;cursor:pointer;white-space:nowrap;border:1px solid var(--line);background:rgba(16,20,27,.7);backdrop-filter:blur(8px);color:var(--ink2);transition:background .2s,color .2s,border-color .2s}
.pill:hover{color:var(--ink)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#04121a;box-shadow:0 0 26px rgba(143,230,255,.28)}
.grid{margin-top:32px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.caso{position:relative;display:flex;flex-direction:column;gap:12px;padding:20px 20px 16px;border-radius:12px;background:rgba(14,18,24,.72);border:1px solid var(--line-soft);cursor:pointer;transition:opacity .25s ease,transform .2s ease,box-shadow .25s ease,border-color .25s ease;text-align:left}
.caso:hover{transform:translateY(-2px)}
.caso .topbar{position:absolute;top:-1px;left:-1px;right:-1px;height:2px;border-radius:12px 12px 0 0}
.caso .idrow{display:flex;align-items:flex-start;gap:8px}
.caso .idrow svg{flex:none;margin-top:1px}
.caso .id{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;line-height:1.7;color:var(--ink3)}
.chip-op{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(16,20,27,.7);backdrop-filter:blur(8px);font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--ink2);white-space:nowrap;flex:none}
.chip-op i{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px 1px rgba(143,230,255,.7);flex:none}
.caso .num{font-size:32px;font-weight:200;line-height:1.05;color:var(--ink)}
.caso .frase{font-size:13px;line-height:1.45;color:var(--ink2)}
.caso .cli{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;line-height:1.6;color:var(--ink3)}
.caso .miolo{flex-grow:1;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:8px 0}
.grid.fading .caso{opacity:0}
/* fecho */
.fecho{padding:28px 40px 48px;display:flex;flex-direction:column;align-items:center;text-align:center}
.fecho p{font-weight:200;font-size:clamp(24px,2.2vw,34px);line-height:1.25}
.fecho .r1{color:var(--ink3)}
.fecho .r1 s{text-decoration:line-through;text-decoration-thickness:1px}
.fecho .r2{margin-top:6px;color:var(--ink)}
.fecho .acts{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
/* leitor */
.reader{max-width:720px;margin:0 auto;padding:130px 40px 72px}
.volta-row{display:flex;align-items:center;gap:16px}
.btn-volta{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(16,20,27,.7);backdrop-filter:blur(8px);color:var(--ink2);font:400 13.5px var(--sans);white-space:nowrap;cursor:pointer;transition:color .2s,border-color .2s}
.btn-volta:hover{color:var(--ink);border-color:rgba(162,182,206,.45)}
.volta-row .setor{font-family:var(--mono);font-size:10px;letter-spacing:.4em;color:var(--ink3)}
.reader h1{margin-top:22px;font-weight:200;font-size:clamp(24px,2.4vw,36px);line-height:1.15;color:var(--ink);text-wrap:balance}
.papel-cli{margin-top:14px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;line-height:1.8;color:var(--ink3);text-transform:uppercase}
.kpis{margin-top:36px}
.kpi{display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding:16px 0}
.kpi+.kpi{border-top:1px solid var(--line-soft)}
.kpi .rot{font-size:14.5px;line-height:1.5;color:var(--ink2);max-width:44ch}
.kpi .num{font-size:38px;font-weight:200;line-height:1.05;color:var(--ink);text-align:right;white-space:nowrap}
.meta{margin-top:44px;border-top:1px solid var(--line-soft)}
.meta>div{display:flex;align-items:baseline;justify-content:space-between;gap:24px;padding:13px 0;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.meta .k{color:var(--ink3)}
.meta .v{color:var(--ink2);text-align:right}
.sec{margin-top:60px}
.sec-label{font-family:var(--mono);font-size:10px;letter-spacing:.4em;color:var(--ink3)}
.sec .p1{margin-top:16px;font-size:15px;line-height:1.6;color:var(--ink2);max-width:60ch}
.sec .p2{margin-top:14px;font-size:13.5px;line-height:1.6;color:var(--ink3);max-width:60ch}
.pergunta{margin-top:48px;font-weight:200;font-size:clamp(21px,2.2vw,28px);line-height:1.35;color:var(--ink);text-align:center;text-wrap:balance}
.op-head{margin-top:38px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.op-head h2{font-size:21px;font-weight:200;line-height:1.3;color:var(--ink)}
.fluxo{position:relative;margin-top:36px}
.fluxo .linha{position:absolute;top:3.5px;left:10%;right:10%;height:1px;background:var(--line)}
.fluxo .seta{position:absolute;top:1.5px;width:5px;height:5px;border-top:1px solid rgba(162,182,206,.45);border-right:1px solid rgba(162,182,206,.45);transform:translateX(-70%) rotate(45deg)}
.fluxo .passos{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.fluxo .passo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.fluxo .dot{width:8px;height:8px;border-radius:50%;background:var(--ink2);box-shadow:0 0 0 4px #0a0c12;flex:none}
.fluxo .passo.humano .dot{background:var(--accent);box-shadow:0 0 0 4px #0a0c12,0 0 14px 2px rgba(143,230,255,.65),0 0 34px 6px rgba(143,230,255,.25)}
.fluxo .txt{font-size:12.5px;line-height:1.45;color:var(--ink2);max-width:130px}
.fluxo .passo.humano .txt{color:var(--ink)}
.comp{margin-top:22px;border:1px solid var(--line-soft);border-radius:12px;background:rgba(14,18,24,.72);padding:26px 30px}
.comp .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.4em;color:var(--ink3);text-transform:uppercase}
.comp .row{margin-top:20px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.comp .cel{flex:1;min-width:150px}
.comp .cel .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
.comp .cel .v{margin-top:9px;font-size:25px;font-weight:200;color:var(--ink)}
.comp .arrow{font-size:20px;color:var(--accent);text-shadow:0 0 18px rgba(143,230,255,.5)}
.comp .nota{margin-top:18px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;line-height:1.7;color:var(--ink3)}
.fluxo-vivo{margin-top:24px}
.fluxo-vivo a{font-size:14px;color:var(--accent)}
.fluxo-vivo a:hover{color:var(--accent);text-shadow:0 0 18px rgba(143,230,255,.5)}
.pager{margin-top:68px;border-top:1px solid var(--line-soft);padding-top:24px;display:flex;justify-content:space-between;gap:24px}
.pager button{font-size:14.5px;color:var(--ink2);cursor:pointer;line-height:1.4}
.pager button:hover{color:var(--accent)}
.pager .prox{text-align:right}
.center{display:flex;justify-content:center}
/* footer (igual à home) */
footer{border-top:1px solid var(--line-soft);padding:48px 40px 36px}
.foot-inner{max-width:1180px;margin:0 auto}
.foot-logo{height:16px;display:block}
.foot-row{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-top:28px;flex-wrap:wrap}
.foot-copy{font-size:14px;color:var(--ink2)}
.foot-social{display:flex;gap:28px}
.foot-social a{color:var(--ink2);display:inline-flex}
.foot-social a:hover{color:var(--ink)}
.foot-div{height:1px;background:var(--line-soft);margin:32px 0 22px}
.foot-links{display:flex;justify-content:center;gap:44px}
.foot-links a{font-size:14px;color:var(--ink2)}
.foot-links a:hover{color:var(--ink)}
</style>
</head>

<script>
(function(){
'use strict';
var C=window.CASOS, N=C.dados.length;
var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var view=document.getElementById('view');
var filtro='Todos';

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function casoAtual(){var m=location.hash.match(/^#caso-(\d+)$/);if(!m)return null;var i=+m[1];return(i>=0&&i<N)?i:null;}

/* ---------- índice ---------- */
function htmlCard(c,i){
  var cor=C.cores[c.setor], vit=C.vitrines[i];
  var oculto=(filtro!=='Todos'&&c.setor!==filtro);
  return '<button class="caso" data-i="'+i+'" aria-label="'+esc(c.papel)+'"'+(oculto?' style="display:none"':'')+'>'
    +'<span class="topbar" style="background:'+cor+'"></span>'
    +'<span class="idrow">'
    +'<span class="id">'+esc((c.setor+' · '+c.papel).toUpperCase())+'</span>'
    +'</span>'
    +'<span class="miolo"><span class="num">'+esc(vit[0])+'</span><span class="frase">'+esc(vit[1])+'</span></span>'
    +'<span class="cli">'+esc(c.cliente)+'</span>'
    +'</button>';
}
function renderIndex(){
  var pills=C.setores.map(function(n){return '<button class="pill'+(n===filtro?' on':'')+'" data-f="'+esc(n)+'">'+esc(n)+'</button>';}).join('');
  var cards=C.dados.map(htmlCard).join('');
  view.innerHTML=
    '<section class="hero"><div class="mono-label">Casos</div><h1>Organizações que já operam com <em class="em">agentes de IA</em>.</h1></section>'
    +'<section class="wrap"><div class="pills" role="group" aria-label="Filtrar por setor">'+pills+'</div>'
    +'<div class="grid" id="grid">'+cards+'</div></section>'
    +'<section class="fecho">'
    +'<p class="r2">Seja uma organização <em class="em">agêntica</em>.</p>'
    +'<div class="acts"><a class="btn btn-p" href="https://formulario.daltonlab.ai/" target="_blank" rel="noopener">Fale com um especialista</a></div>'
    +'</section>';
  view.querySelectorAll('.pill').forEach(function(b){b.addEventListener('click',function(){setFiltro(b.dataset.f);});});
  view.querySelectorAll('.caso').forEach(function(b){b.addEventListener('click',function(){location.hash='caso-'+b.dataset.i;});});
  pintarPills();
}
/* pill ativa ganha a cor do setor (Todos fica no ciano padrão) */
function pintarPills(){
  view.querySelectorAll('.pill').forEach(function(b){
    var on=b.dataset.f===filtro, cor=C.cores[b.dataset.f];
    b.classList.toggle('on',on);
    if(on&&cor){b.style.background=cor;b.style.borderColor=cor;b.style.color='#04121a';b.style.boxShadow='0 0 26px '+cor+'55';}
    else{b.style.background='';b.style.borderColor='';b.style.color='';b.style.boxShadow='';}
  });
}
function setFiltro(f){
  if(f===filtro)return;
  var grid=document.getElementById('grid');
  var aplicar=function(){
    filtro=f;
    pintarPills();
    view.querySelectorAll('.caso').forEach(function(b){
      var c=C.dados[+b.dataset.i];
      b.style.display=(f==='Todos'||c.setor===f)?'':'none';
    });
    grid.classList.remove('fading');
  };
  if(reduced){aplicar();return;}
  grid.classList.add('fading');
  setTimeout(aplicar,240);
}

/* ---------- leitor ---------- */
function renderReader(i){
  var c=C.dados[i], p=C.perguntas[i];
  var kpis=c.kpis.map(function(k){return '<div class="kpi"><div class="rot">'+esc(k.rotulo)+'</div><div class="num">'+esc(k.numero)+'</div></div>';}).join('');
  var passos=c.fluxo.slice(0,4).map(function(t){return '<div class="passo"><div class="dot"></div><div class="txt">'+esc(t)+'</div></div>';}).join('')
    +'<div class="passo humano"><div class="dot"></div><div class="txt">'+esc(c.fluxo[4])+'</div></div>';
  var setas=[20,40,60,80].map(function(x){return '<div class="seta" style="left:'+x+'%"></div>';}).join('');
  var impacto='';
  if(c.comparativo){
    impacto='<div class="sec"><div class="sec-label">IMPACTO</div>'
      +'<div class="comp"><div class="lbl">'+esc(c.comparativo.label)+'</div>'
      +'<div class="row"><div class="cel"><div class="k">'+esc(c.comparativo.pares[0].rotulo)+'</div><div class="v">'+esc(c.comparativo.pares[0].valor)+'</div></div>'
      +'<div class="arrow" aria-hidden="true">→</div>'
      +'<div class="cel"><div class="k">'+esc(c.comparativo.pares[1].rotulo)+'</div><div class="v">'+esc(c.comparativo.pares[1].valor)+'</div></div></div>'
      +'<div class="nota">'+esc(c.comparativo.nota)+'</div></div>'
      +'</div>';
  }
  view.innerHTML=
    '<section class="reader">'
    +'<div class="volta-row"><button class="btn-volta" id="voltar1" type="button">← Voltar para os casos</button><span class="setor">'+esc(c.setor.toUpperCase())+'</span></div>'
    +'<h1>'+esc(c.headline)+'</h1>'
    +'<div class="papel-cli">'+esc(c.papel+' · '+c.cliente)+'</div>'
    +'<div class="kpis">'+kpis+'</div>'
    +'<div class="meta">'
    +'<div><span class="k">SETOR</span><span class="v">'+esc(c.setor.toUpperCase())+'</span></div>'
    +'<div><span class="k">ESTÁGIO</span><span class="v">'+esc(C.publico(c.estagio).toUpperCase())+'</span></div>'
    +'<div><span class="k">PAPEL DO AGENTE</span><span class="v">'+esc(c.papel.toUpperCase())+'</span></div>'
    +'</div>'
    +'<div class="sec"><div class="sec-label">DESAFIO</div>'
    +'<p class="p1">'+esc(c.problema)+'</p><p class="p2">'+esc(c.comoTrabalhava)+'</p>'
    +'<p class="pergunta">'+esc(p[0])+'<em class="em">'+esc(p[1])+'</em>'+esc(p[2])+'</p></div>'
    +'<div class="sec"><div class="sec-label">SOLUÇÃO</div>'
    +'<p class="p1">'+esc(c.oQueMudou)+'</p>'
    +'<div class="op-head"><h2>O agente na operação</h2><span class="chip-op"><i></i>HUMANO ACIMA DO LOOP</span></div>'
    +'<div class="fluxo"><div class="linha"></div>'+setas+'<div class="passos">'+passos+'</div></div></div>'
    +impacto
    +'<div class="center" style="margin-top:64px;border-top:1px solid var(--line-soft);padding-top:36px"><button class="btn btn-s" id="voltar2" type="button">← Voltar para os casos</button></div>'
    +'</section>';
  document.getElementById('voltar1').addEventListener('click',voltar);
  document.getElementById('voltar2').addEventListener('click',voltar);
}
function voltar(){
  if(location.hash){history.pushState('', document.title, location.pathname+location.search);}
  render();window.scrollTo(0,0);
}
function render(){
  var i=casoAtual();
  if(i===null)renderIndex();else renderReader(i);
}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});

/* header vidro */
var hdr=document.getElementById('hdr');
window.addEventListener('scroll',function(){hdr.classList.toggle('scrolled',window.scrollY>80);},{passive:true});

/* links mortos do chrome */
document.querySelectorAll('header a.dead,footer a.dead').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();});});

render();
})();
</script>
