<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<style>
  /* ===== Insights hub — page-specific ===== */
  .ins-hero { padding-top: 116px; padding-bottom: 6px; }
  .ins-hero .eyebrow { margin-bottom: 16px; }
  .ins-hero h1 { line-height: 1.03; margin-bottom: 18px; }
  .ins-hero .lede { max-width: 34ch; }

  /* Search */
  .ins-search-wrap {
    position: relative;
    margin-top: 28px;
  }
  .ins-search-wrap svg {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none;
  }
  #ins-search {
    width: 100%;
    appearance: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-pill, 999px);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 15px;
    padding: 14px 18px 14px 46px;
    transition: border-color .3s, box-shadow .3s;
  }
  #ins-search::placeholder { color: var(--muted); }
  #ins-search:focus { outline: none; border-color: rgba(76,184,232,0.5); box-shadow: 0 0 0 4px rgba(76,184,232,0.12); }

  /* Tabs */
  .ins-tabs {
    display: flex; gap: 6px; padding: 5px;
    margin: 22px auto 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-pill, 999px);
    width: 100%; max-width: 360px;
  }
  .ins-tab {
    appearance: none; border: 0; cursor: pointer;
    flex: 1; text-align: center;
    font-family: var(--font-mono);
    font-size: 12.5px; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--text-dim); background: transparent;
    padding: 11px 20px; border-radius: var(--r-pill, 999px);
    transition: color .3s, background .3s; white-space: nowrap;
  }
  .ins-tab.active { color: #06121a; background: var(--cyan); }
  .ins-tab:not(.active):hover { color: var(--text); }

  /* List — Anthropic-style clean rows */
  .ins-list { display: flex; flex-direction: column; margin-top: 8px; }
  .ip-row {
    display: flex; align-items: center; gap: 14px;
    padding: 24px 0;
    border-top: 1px solid var(--border-2);
    text-decoration: none;
    transition: padding-left .3s var(--ease, ease);
  }
  .ip-row:last-child { border-bottom: 1px solid var(--border-2); }
  .ip-row:hover { padding-left: 6px; }
  .ip-row-main { flex: 1; min-width: 0; }
  .ip-meta {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-mono);
    font-size: 11.5px; font-weight: 500; letter-spacing: 0.03em;
    color: var(--muted);
    margin-bottom: 9px;
  }
  .ip-cat { color: var(--cyan); }
  .ip-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border); flex: none; }
  .ip-title {
    font-family: var(--font-display);
    font-weight: 700; letter-spacing: -0.02em;
    font-size: clamp(1.12rem, 4.4vw, 1.32rem);
    line-height: 1.22; color: var(--text);
    text-wrap: pretty;
  }
  .ip-row:hover .ip-title { color: var(--cyan-bright, var(--cyan)); }
  .ip-by {
    display: flex; align-items: center; gap: 8px;
    margin-top: 13px;
  }
  .ip-by img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; object-position: center 20%; border: 1px solid var(--border); }
  .ip-by-name { font-size: 13px; font-weight: 600; color: var(--text-dim); }
  .ip-by-role { font-size: 12.5px; color: var(--muted); }
  .ip-go {
    flex: none; color: var(--muted); font-size: 18px;
    transition: transform .3s, color .3s;
  }
  .ip-row:hover .ip-go { transform: translateX(4px); color: var(--cyan); }
  .ip-empty { color: var(--muted); padding: 40px 0; font-family: var(--font-mono); font-size: 13px; }

  /* ===== Reader ===== */
  .ins-reader { display: none; }
  .ins-reader.open { display: block; }
  body.reading .ins-index { display: none; }

  .ir-article { padding-top: calc(104px + var(--safe-top)); padding-bottom: 56px; }
  .ir-back {
    appearance: none; background: none; border: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-size: 12.5px; letter-spacing: 0.03em;
    color: var(--text-dim); padding: 0; margin-bottom: 26px;
    transition: color .3s, gap .3s;
  }
  .ir-back:hover { color: var(--cyan); gap: 10px; }
  .ir-meta {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 500;
    letter-spacing: 0.03em; color: var(--muted); margin-bottom: 16px;
  }
  .ir-title {
    font-family: var(--font-display);
    font-weight: 800; letter-spacing: -0.035em;
    font-size: clamp(1.95rem, 8vw, 2.7rem);
    line-height: 1.06; color: var(--text);
    text-wrap: balance;
  }
  .ir-dek {
    color: var(--text-dim);
    font-size: clamp(1.05rem, 3vw, 1.2rem);
    line-height: 1.5; margin-top: 16px;
    max-width: 52ch;
  }

  /* author card (insight) */
  .ir-author {
    display: flex; align-items: center; gap: 13px;
    margin-top: 26px; padding: 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius, 16px);
  }
  .ir-author > img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; object-position: center 20%; border: 1px solid var(--border); flex: none; }
  .ir-author-info { flex: 1; min-width: 0; }
  .ir-author-name { font-family: var(--font-display); font-weight: 700; font-size: 1rem; color: var(--text); letter-spacing: -0.01em; }
  .ir-author-role { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .ir-author-li {
    flex: none; width: 38px; height: 38px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-dim); background: transparent;
    border: 0;
    transition: color .3s, transform .3s;
  }
  .ir-author-li:hover { color: var(--cyan); transform: translateY(-2px); }

  .ir-byline { margin-top: 22px; }
  .ir-byteam {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em;
    color: var(--text-dim);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .ir-byteam::before { content: ""; width: 18px; height: 1px; background: var(--cyan); }

  /* hero illustration */
  .ir-hero {
    height: 200px; margin: 30px 0 34px;
    border-radius: var(--radius, 16px);
    border: 1px solid var(--border);
    position: relative; overflow: hidden;
  }
  .ir-hero::after {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 22px 22px; opacity: .5;
  }

  /* body */
  .ir-body { max-width: 64ch; margin-top: 32px; }
  .ir-p {
    color: var(--text-dim);
    font-size: clamp(1.04rem, 2.7vw, 1.14rem);
    line-height: 1.7; margin-bottom: 22px;
  }
  .ir-h {
    font-family: var(--font-display);
    font-weight: 700; letter-spacing: -0.02em;
    font-size: clamp(1.3rem, 5vw, 1.6rem);
    line-height: 1.18; color: var(--text);
    margin: 36px 0 16px;
  }
  .ir-q {
    margin: 32px 0;
    padding-left: 20px;
    border-left: 2px solid var(--cyan);
    font-family: var(--font-serif);
    font-style: italic; font-weight: 500;
    font-size: clamp(1.4rem, 5.5vw, 1.85rem);
    line-height: 1.28; color: var(--text);
    text-wrap: balance;
  }

  .ir-pdf { margin-top: 14px; display: inline-flex; align-items: center; gap: 9px; }

  /* related */
  .ir-related { margin-top: 52px; padding-top: 30px; border-top: 1px solid var(--border-2); }
  .ir-related .eyebrow { margin-bottom: 18px; }
  .ir-rel-grid { display: flex; flex-direction: column; gap: 14px; }
  .ir-rel {
    display: block; text-decoration: none;
    border: 1px solid var(--border);
    border-radius: var(--radius, 16px);
    background: var(--surface);
    padding: 18px;
    transition: border-color .3s, transform .3s;
  }
  .ir-rel:hover { border-color: rgba(76,184,232,0.4); transform: translateY(-2px); }
  .ir-rel-title {
    font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em;
    font-size: 1.06rem; line-height: 1.25; color: var(--text);
    margin: 8px 0 12px; text-wrap: pretty;
  }
  .ir-rel-go { font-family: var(--font-mono); font-size: 12px; color: var(--cyan); }

  @media (min-width: 760px) {
    .ir-rel-grid { display: grid; grid-template-columns: 1fr 1fr; }
  }

  /* print → "download PDF" */
  @media print {
    .header, .sheet, .footer, .ins-index, .ir-back, .ir-pdf, .ir-related { display: none !important; }
    body { background: #fff !important; }
    .ir-article { padding-top: 0; }
    .ir-title, .ir-h, .ir-q, .ir-author-name { color: #0a0a0a !important; }
    .ir-p, .ir-dek, .ir-author-role { color: #333 !important; }
    .ir-hero { display: none; }
  }
</style>

<script>
  // search placeholder i18n (applyLang only handles textContent)
  (function () {
    const apply = () => {
      const lang = (function(){ try { return localStorage.getItem("dl_lang") || "pt"; } catch(e){ return "pt"; } })();
      const dict = window.I18N[lang] || window.I18N.pt;
      document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
        const v = dict[el.getAttribute("data-i18n-ph")];
        if (v) el.setAttribute("placeholder", v);
      });
    };
    apply();
    window.addEventListener("langchange", apply);
  })();
</script>
