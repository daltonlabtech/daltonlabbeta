<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dalton Lab · Demos da home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --void:#050608;
  --ink:#e6edf4; --ink2:#aab8c8; --ink3:#7d8898;
  --accent:#8fe6ff;
  --line:rgba(162,182,206,.26);
  --line-soft:rgba(162,182,206,.12);
  --sans:"Manrope","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code","SF Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--ink2);font:400 15px/1.5 var(--sans);min-height:100vh;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(120% 100% at 50% 30%,#12131a 0%,#0a0b11 42%,#050608 78%,#030304 100%);pointer-events:none;z-index:0}
a{color:var(--ink2);text-decoration:none}
.top{position:relative;z-index:2;padding:20px 40px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}
.title{grid-column:2;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink3)}
.title strong{font-weight:400;color:var(--ink)}
.sync{grid-column:3;justify-self:end;display:inline-flex;align-items:center;gap:10px;background:rgba(16,20,27,.7);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font:400 13px var(--sans);color:var(--ink2);cursor:pointer}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);transition:background .2s,box-shadow .2s}
.sync.on{color:var(--ink);border-color:rgba(143,230,255,.5)}
.sync.on .dot{background:var(--accent);box-shadow:0 0 10px rgba(143,230,255,.8)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:999px}
.foldbar{position:relative;z-index:2;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:16px 40px 0}
.fb{background:rgba(16,20,27,.55);border:1px solid var(--line-soft);border-radius:999px;padding:8px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);cursor:pointer;transition:color .2s,border-color .2s}
.fb:hover{color:var(--ink);border-color:var(--line)}
.fb b{font-weight:400;color:var(--ink2);margin-right:6px}
.stage{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;gap:56px;padding:34px 40px;flex-wrap:wrap}
.demo{display:flex;flex-direction:column;gap:12px}
.demo-label{font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink3)}
.frame{border:1px solid var(--line);background:var(--void);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.frame-phone{border-radius:30px;width:331.5px;height:717.4px}
.frame-desk{border-radius:12px;width:604.8px;height:378px}
.frame iframe{border:0;transform-origin:top left;display:block}
.frame-phone iframe{width:390px;height:844px;transform:scale(.85)}
.frame-desk iframe{width:1440px;height:900px;transform:scale(.42)}
.hint{position:relative;z-index:2;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink3);padding-bottom:28px}
</style>
</head>
<body>
<div class="top">
  <span style="grid-column:1;justify-self:start;display:flex;gap:8px;flex-wrap:wrap">
    <a class="fb" href="casos-index.html"><b>→</b>Casos</a>
    <a class="fb" href="quem-somos-index.html"><b>→</b>Quem Somos</a>
    <a class="fb" href="conteudos-index.html"><b>→</b>Conteúdos</a>
  </span>
  <div class="title"><strong>Dalton Lab</strong> · demo da home · aprovação interna</div>
  <button class="sync" id="sync" type="button" aria-pressed="false"><span class="dot"></span>Scroll sincronizado</button>
</div>
<div class="foldbar" role="group" aria-label="Ir para dobra">
  <button class="fb" data-f="0"><b>01</b>Hero</button>
  <button class="fb" data-f="1"><b>02</b>Organograma</button>
  <button class="fb" data-f="2"><b>03</b>Uma pessoa só</button>
  <button class="fb" data-f="3"><b>04</b>O caminho</button>
  <button class="fb" data-f="4"><b>05</b>Jornada</button>
  <button class="fb" data-f="5"><b>06</b>Places to Work</button>
  <button class="fb" data-f="6"><b>07</b>Fecho</button>
  <button class="fb" data-f="7"><b>08</b>Conteúdos</button>
</div>
<div class="stage">
  <div class="demo">
    <div class="demo-label">Mobile · 390 × 844</div>
    <div class="frame frame-phone"><iframe id="fMob" src="mobile.html" title="Demo mobile"></iframe></div>
  </div>
  <div class="demo">
    <div class="demo-label">Desktop · 1440 × 900</div>
    <div class="frame frame-desk"><iframe id="fDesk" src="desktop.html" title="Demo desktop"></iframe></div>
  </div>
</div>
<div class="hint">clique numa dobra para levar as duas demos até ela</div>

<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#050608"/><circle cx="50" cy="38" r="9" fill="none" stroke="#8fe6ff" stroke-width="2"/><circle cx="32" cy="64" r="6" fill="#c9b8ff"/><circle cx="50" cy="68" r="6" fill="#a8f0cf"/><circle cx="68" cy="64" r="6" fill="#ffb8d9"/><path d="M50 47v14M50 56l-15 5M50 56l15 5" stroke="#7d8898" stroke-width="1.5" fill="none"/></svg>
</template>

<script>
(function(){
"use strict";
const fMob=document.getElementById('fMob'),fDesk=document.getElementById('fDesk');
const syncBtn=document.getElementById('sync');
let sync=false,lock=false,pause=0;

syncBtn.addEventListener('click',()=>{
  sync=!sync;
  syncBtn.classList.toggle('on',sync);
  syncBtn.setAttribute('aria-pressed',String(sync));
});

function attach(f,other){
  f.addEventListener('load',()=>{
    const w=f.contentWindow;
    w.addEventListener('scroll',()=>{
      if(!sync||lock||Date.now()<pause)return;
      lock=true;
      try{
        const d=w.document.documentElement;
        const max=d.scrollHeight-w.innerHeight;
        const p=max>0?w.scrollY/max:0;
        const ow=other.contentWindow,od=ow.document.documentElement;
        ow.scrollTo(0,p*(od.scrollHeight-ow.innerHeight));
      }catch(e){}
      requestAnimationFrame(()=>{lock=false;});
    },{passive:true});
  });
}
attach(fMob,fDesk);
attach(fDesk,fMob);

document.querySelectorAll('.fb').forEach(b=>{
  b.addEventListener('click',()=>{
    const i=+b.dataset.f;
    pause=Date.now()+1200; /* evita briga com o sync durante o smooth scroll */
    [fMob,fDesk].forEach(f=>{
      try{
        const w=f.contentWindow;
        const tops=w.getFoldTops&&w.getFoldTops();
        if(tops)w.scrollTo({top:Math.max(0,tops[i]),behavior:'smooth'});
      }catch(e){}
    });
  });
});
})();
</script>
</body>
</html>
