<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dalton Lab · Conteúdos (desktop)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400&family=Playfair+Display:ital,wght@1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --void:#050608;
  --ink:#e6edf4; --ink2:#aab8c8; --ink3:#7d8898;
  --accent:#8fe6ff;
  --line:rgba(162,182,206,.26);
  --line-soft:rgba(162,182,206,.12);
  --sans:"Manrope","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --serif:"Playfair Display","Baskerville","Bodoni MT","Didot",Georgia,serif;
  --mono:"JetBrains Mono","Cascadia Code","SF Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--void);color:var(--ink2);font:400 15px/1.55 var(--sans);overflow-x:hidden}
a{color:var(--ink2);text-decoration:none}
a:hover{color:var(--ink)}
button{font:inherit;background:none;border:none;color:inherit}
.bg-grad,.bg-grain,.bg-vig{position:fixed;inset:0;pointer-events:none}
.bg-grad{background:radial-gradient(120% 100% at 50% 30%,#12131a 0%,#0a0b11 42%,#050608 78%,#030304 100%);z-index:0}
.bg-grain{background-image:radial-gradient(rgba(200,220,255,.6) .5px,transparent .5px);background-size:3px 3px;opacity:.045;mix-blend-mode:screen;z-index:1}
.bg-vig{box-shadow:inset 0 0 260px 70px rgba(0,0,0,.82);z-index:2}
main,footer{position:relative;z-index:3}
.em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--accent);text-shadow:0 0 28px rgba(143,230,255,.35),0 0 60px rgba(143,230,255,.14)}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:15px 30px;border-radius:999px;border:0;font:400 15px var(--sans);white-space:nowrap;cursor:pointer}
.btn-p{background:var(--accent);color:#04121a;box-shadow:0 0 26px rgba(143,230,255,.28)}
.btn-p:hover{filter:brightness(1.08);color:#04121a}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:999px}
/* header (igual à home) */
header{position:fixed;top:0;left:0;right:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:92px;padding:0 44px;background:transparent;border-bottom:1px solid transparent;transition:background .3s,border-color .3s,backdrop-filter .3s}
header.scrolled{background:rgba(8,10,15,.72);backdrop-filter:blur(12px);border-bottom-color:var(--line-soft)}
.brand{display:inline-flex;align-items:center;justify-self:start}
.brand img{height:22px;display:block}
nav.main-nav{display:flex;gap:34px}
nav.main-nav a{font:400 15px var(--sans);color:var(--ink2)}
nav.main-nav a:hover{color:var(--ink)}
nav.main-nav .atual{font:400 15px var(--sans);color:var(--ink);padding-bottom:5px;border-bottom:1px solid var(--accent)}
.hdr-right{display:flex;align-items:center;gap:16px;justify-self:end}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(16,20,27,.55);backdrop-filter:blur(8px)}
.lang span{font:400 12px var(--sans);padding:7px 13px;color:var(--ink3)}
.lang .on{background:rgba(162,182,206,.14);color:var(--ink)}
.btn-hdr{min-height:38px;padding:9px 20px;font-size:14px}
.dead{cursor:default}
/* hero */
.hero{padding:150px 40px 32px;display:flex;flex-direction:column;align-items:center;text-align:center}
.mono-label{font-family:var(--mono);font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--ink3)}
.hero h1{margin-top:18px;font-weight:200;font-size:clamp(30px,3.4vw,46px);line-height:1.08;letter-spacing:-.01em;color:var(--ink);max-width:840px;text-wrap:balance}
.wrap{max-width:1120px;margin:0 auto;padding:0 40px 56px}
/* destaque */
.feat{display:grid;grid-template-columns:1.25fr 1fr;border-radius:16px;overflow:hidden;background:rgba(14,18,24,.72);border:1px solid var(--line-soft);transition:border-color .3s}
.feat:hover{border-color:var(--line)}
.feat .img{min-height:300px;background-size:cover;background-position:center}
.feat .body{padding:34px 36px;display:flex;flex-direction:column;gap:14px}
.tagrow{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent)}
.tag.artigo{color:#c9b8ff}
.data{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink3)}
.feat h2{font-weight:200;font-size:clamp(19px,1.8vw,26px);line-height:1.3;color:var(--ink)}
.feat .veic{margin-top:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink3)}
.feat .leia{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--accent)}
/* filtro */
.filtro{margin-top:40px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filtro .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink3);margin-right:8px}
.pill{padding:10px 20px;min-height:40px;border-radius:999px;font-size:13.5px;cursor:pointer;white-space:nowrap;border:1px solid var(--line);background:rgba(16,20,27,.7);backdrop-filter:blur(8px);color:var(--ink2);transition:background .2s,color .2s,border-color .2s}
.pill:hover{color:var(--ink)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#04121a;box-shadow:0 0 26px rgba(143,230,255,.28)}
/* grid */
.grid{margin-top:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:rgba(14,18,24,.72);border:1px solid var(--line-soft);transition:border-color .3s,transform .2s}
.card:hover{border-color:var(--line);transform:translateY(-2px);color:var(--ink2)}
.card .img{aspect-ratio:16/9;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
.card .img .veic-fallback{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(230,237,244,.8);text-align:center;padding:0 20px}
.card .body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:9px;flex:1}
.card h3{font-weight:400;font-size:13.5px;line-height:1.45;color:var(--ink)}
.card .veic{margin-top:auto;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink3)}
/* vazio (artigos em breve) */
.vazio{margin-top:28px;border:1px dashed var(--line);border-radius:14px;padding:48px 32px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.vazio .t{font-weight:200;font-size:19px;color:var(--ink)}
.vazio .s{font-size:13.5px;color:var(--ink3);max-width:46ch}
/* fecho */
.fecho{padding:20px 40px 48px;display:flex;flex-direction:column;align-items:center;text-align:center}
.fecho p{font-weight:200;font-size:clamp(24px,2.2vw,34px);line-height:1.25;color:var(--ink)}
.fecho .acts{margin-top:22px}
/* footer (igual à home) */
footer{border-top:1px solid var(--line-soft);padding:48px 40px 36px}
.foot-inner{max-width:1180px;margin:0 auto}
.foot-logo{height:16px;display:block}
.foot-row{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-top:28px;flex-wrap:wrap}
.foot-copy{font-size:14px;color:var(--ink2)}
.foot-social{display:flex;gap:28px}
.foot-social a{color:var(--ink2);display:inline-flex}
.foot-social a:hover{color:var(--ink)}
.foot-div{height:1px;background:var(--line-soft);margin:32px 0 22px}
.foot-links{display:flex;justify-content:center;gap:44px}
.foot-links a{font-size:14px;color:var(--ink2)}
.foot-links a:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="bg-grad"></div><div class="bg-grain"></div><div class="bg-vig"></div>

<header id="hdr">
  <a class="brand" href="desktop.html" aria-label="Dalton Lab — voltar à home"><img src="daltonlab-logo.png" alt="Dalton Lab"></a>
  <nav class="main-nav" aria-label="Navegação principal">
    <a href="desktop.html#dobra5">Metodologia</a>
    <a href="casos-desktop.html">Casos</a>
    <span class="atual" aria-current="page">Conteúdos</span>
    <a href="quem-somos-desktop.html">Quem Somos</a>
  </nav>
  <div class="hdr-right">
    <div class="lang" role="group" aria-label="Idioma"><span class="on">PT</span><span>EN</span></div>
    <a class="btn btn-p btn-hdr" href="https://formulario.daltonlab.ai/" target="_blank" rel="noopener">Fale conosco</a>
  </div>
</header>

<main>
  <section class="hero" data-screen-label="Conteúdos · Hero">
    <div class="mono-label">Conteúdos</div>
    <h1>O Dalton Lab na mídia e nossos <em class="em">artigos</em>.</h1>
  </section>

  <div class="wrap" id="view" aria-live="polite"></div>

  <section class="fecho" data-screen-label="Conteúdos · Fecho">
    <p>Seja uma organização <em class="em">agêntica</em>.</p>
    <div class="acts"><a class="btn btn-p" href="https://formulario.daltonlab.ai/" target="_blank" rel="noopener">Fale com um especialista</a></div>
  </section>
</main>

<footer>
  <div class="foot-inner">
    <a href="desktop.html"><img class="foot-logo" src="daltonlab-logo.png" alt="Dalton Lab"></a>
    <div class="foot-row">
      <p class="foot-copy">© 2026 Dalton Lab. Todos os direitos reservados.</p>
      <div class="foot-social">
        <a href="#" class="dead" aria-label="LinkedIn"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="2" y="2" width="20" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"></rect><circle cx="8" cy="8.6" r="1.4"></circle><rect x="6.9" y="11" width="2.2" height="6.5" rx="1"></rect><path d="M12 11h2.1v1c.5-.7 1.3-1.2 2.4-1.2 1.8 0 2.7 1.1 2.7 3.2v3.5h-2.2v-3.2c0-1-.4-1.6-1.3-1.6-.9 0-1.5.6-1.5 1.7v3.1H12z"></path></svg></a>
        <a href="#" class="dead" aria-label="YouTube"><svg viewBox="0 0 24 24" width="22" height="22"><rect x="2" y="5" width="20" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"></rect><path d="M10 9.2l5 2.8-5 2.8z" fill="currentColor"></path></svg></a>
        <a href="#" class="dead" aria-label="Spotify"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M7.5 10.2c3-.9 6.2-.5 8.8 1M8 13c2.4-.7 5-.4 7 .8M8.6 15.6c1.8-.5 3.7-.3 5.2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg></a>
        <a href="#" class="dead" aria-label="Instagram"><svg viewBox="0 0 24 24" width="22" height="22"><rect x="2.5" y="2.5" width="19" height="19" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"></rect><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"></circle><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"></circle></svg></a>
      </div>
    </div>
    <div class="foot-div"></div>
    <div class="foot-links">
      <a href="#" class="dead">Política de Privacidade</a>
      <a href="#" class="dead">Termos de Uso</a>
    </div>
  </div>
</footer>

<script src="conteudos-data.js"></script>
<script>
(function(){
'use strict';
var C=window.CONTEUDOS;
var view=document.getElementById('view');
var filtro='Todos';

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function itens(){
  var a=C.artigos.map(function(x){x=Object.assign({},x);x.tipo='Artigo';return x;});
  var m=C.midia.map(function(x){x=Object.assign({},x);x.tipo='Mídia';return x;});
  return a.concat(m);
}
function imgHtml(item,i,cls){
  if(item.img) return '<div class="img '+cls+'" style="background-image:url(\''+item.img+'\')"></div>';
  return '<div class="img '+cls+'" style="background:'+C.grads[i%C.grads.length]+'"><span class="veic-fallback">'+esc(item.veiculo)+'</span></div>';
}
function cardHtml(item,i){
  return '<a class="card" href="'+esc(item.url)+'" target="_blank" rel="noopener">'
    +imgHtml(item,i,'')
    +'<span class="body">'
    +'<span class="tagrow"><span class="tag'+(item.tipo==='Artigo'?' artigo':'')+'">'+item.tipo+'</span><span class="data">'+esc(item.data)+'</span></span>'
    +'<h3>'+esc(item.titulo)+'</h3>'
    +'<span class="veic">'+esc(item.veiculo)+' →</span>'
    +'</span></a>';
}
function render(){
  var todos=itens();
  var lista=todos.filter(function(x){return filtro==='Todos'||(filtro==='Artigos'?x.tipo==='Artigo':x.tipo==='Mídia');});
  var html='';
  if(lista.length){
    var f=lista[0];
    html+='<a class="feat" href="'+esc(f.url)+'" target="_blank" rel="noopener">'
      +imgHtml(f,0,'')
      +'<span class="body">'
      +'<span class="tagrow"><span class="tag'+(f.tipo==='Artigo'?' artigo':'')+'">'+f.tipo+'</span><span class="data">'+esc(f.data)+'</span></span>'
      +'<h2>'+esc(f.titulo)+'</h2>'
      +'<span class="veic">'+esc(f.veiculo)+'</span>'
      +'<span class="leia">Leia a matéria →</span>'
      +'</span></a>';
  }
  html+='<div class="filtro" role="group" aria-label="Filtrar conteúdo"><span class="lbl">Filtrar</span>'
    +['Todos','Artigos','Mídia'].map(function(n){return '<button class="pill'+(n===filtro?' on':'')+'" data-f="'+n+'">'+n+'</button>';}).join('')
    +'</div>';
  var resto=lista.slice(1);
  if(resto.length){
    html+='<div class="grid">'+resto.map(cardHtml).join('')+'</div>';
  }
  if(!lista.length){
    html+='<div class="vazio"><div class="t">Nossos artigos chegam em breve.</div><div class="s">Estamos preparando publicações sobre organizações agênticas, agentes de IA na operação e o futuro do trabalho.</div></div>';
  }
  view.innerHTML=html;
  view.querySelectorAll('.pill').forEach(function(b){b.addEventListener('click',function(){filtro=b.dataset.f;render();});});
}
render();

/* header vidro */
var hdr=document.getElementById('hdr');
window.addEventListener('scroll',function(){hdr.classList.toggle('scrolled',window.scrollY>80);},{passive:true});
document.querySelectorAll('a.dead').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();});});
})();
</script>
</body>
</html>
